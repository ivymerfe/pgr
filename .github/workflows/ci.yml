name: CI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly toolchain (for eBPF build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --version 0.10.4 --locked

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Prepare binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp target/release/pgr pgr-${{ github.ref_name }}-x86_64-linux

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pgr-${{ github.ref_name }}
          path: pgr-${{ github.ref_name }}-x86_64-linux

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pgr-${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pgr-${{ github.ref_name }}-x86_64-linux
          generate_release_notes: true
